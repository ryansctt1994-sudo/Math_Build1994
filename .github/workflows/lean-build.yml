name: Lean Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build MathBuild
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        run: |
          curl -fsSLo elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Repository self-check
        run: python scripts/check_repo.py

      - name: Update Lake dependencies
        run: lake update

      - name: Restore Mathlib build cache
        run: lake exe cache get

      - name: Build MathBuild
        run: lake build MathBuild
